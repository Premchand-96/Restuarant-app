services:
  db:
    image: postgres:16-alpine
    container_name: food_delivery_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fooduser
      POSTGRES_PASSWORD: foodpass
      POSTGRES_DB: fooddelivery
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fooduser -d fooddelivery"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: food_delivery_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://fooduser:foodpass@db:5432/fooddelivery
      SECRET_KEY: change_this_secret_key_in_production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/code/app

volumes:
  pgdata:
